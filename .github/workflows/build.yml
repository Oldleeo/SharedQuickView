name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test and publish
        shell: pwsh
        run: ./build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharedQuickView-win-x64
          path: artifacts/installer/共享速览安装程序.exe
          if-no-files-found: error
