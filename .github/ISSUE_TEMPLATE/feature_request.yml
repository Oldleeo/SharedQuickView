name: 功能建议
description: 提议新的功能或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述真实工作流程，但不要包含敏感路径或账号。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可选方案
