name: 问题反馈
description: 报告可稳定复现的软件问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除真实 IP、共享名、公司目录、账号和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 共享速览版本
      placeholder: 例如 2.0.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用虚构 IP 和目录名。
      placeholder: |
        1. 设置目标 IP 为 192.168.1.100
        2. 粘贴已脱敏的示例路径
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误信息
      description: 上传截图前请再次确认已经脱敏。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除真实 IP、共享路径、账号、访问令牌和公司内部信息。
          required: true
